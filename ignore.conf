# Plastic SCM ignore list (workspace root).
# Syntax notes (differs from .gitignore):
#   - no [a-z] character ranges
#   - a trailing slash only hides the files under a folder, not the folder itself
#   - for folders starting with a dot, list both ".name" and ".name/"
#   - a leading "/" anchors the pattern to the project root; without it the
#     pattern matches at any depth (so "delivery/" would also hide docs/delivery/)

# ── Unity generated (never tracked) ────────────────────────────────────
Library
Library/
Temp
Temp/
obj
obj/
Build
Build/
Builds
Builds/
Logs
Logs/
UserSettings
UserSettings/
MemoryCaptures
MemoryCaptures/
Recordings
Recordings/
/delivery
/delivery/
Assets/AssetStoreTools*
ProjectSettings/Packages/com.unity.services.core/

# ── IDE & solution files generated by Unity ───────────────────────────
*.csproj
*.unityproj
*.sln
*.suo
*.user
*.userprefs
*.pidb
*.booproj
*.svd
*.pdb
*.mdb
*.opendb
*.VC.db
.vs
.vs/
.idea
.idea/
.vscode
.vscode/
*.swp
*~

# ── Build & crash artefacts ───────────────────────────────────────────
sysinfo.txt
crashlytics-build.properties
*.apk
*.aab
*.unitypackage
*.app

# ── OS ─────────────────────────────────────────────────────────────────
Thumbs.db
desktop.ini
.DS_Store

# ── Version control metadata of the other VCS ──────────────────────────
# GitHub is the public mirror; its object store must not enter Plastic.
.git
.git/
.worktrees
.worktrees/
